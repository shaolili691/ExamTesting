<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — TAE Exam System</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="auth-page">
  <h1>Create your account</h1>
  <div class="card">
    <div id="errorBox"></div>
    <div class="form-row">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="text" id="email" autocomplete="email">
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="new-password">
    </div>
    <button class="btn" id="registerBtn" style="width:100%" onclick="doRegister()">Register</button>
    <div class="auth-links">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
async function doRegister() {
  const btn = document.getElementById('registerBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.innerHTML = '';
  btn.disabled = true;
  try {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const result = await Api.register(username, email, password);
    Auth.setSession({ accessToken: result.accessToken, refreshToken: result.refreshToken, user: result.user });
    location.href = 'index.html';
  } catch (err) {
    errorBox.innerHTML = `<div class="auth-error">${err.message}</div>`;
    btn.disabled = false;
  }
}

if (Auth.getAccessToken()) location.href = 'index.html';
</script>
</body>
</html>
