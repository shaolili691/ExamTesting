<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis — TAE Exam System</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="layout">
<div id="sidebarRoot" class="sidebar"></div>
<div class="main-content">
<div id="topBarRoot" class="top-bar"></div>
<div class="container">
  <div class="page-header">
    <h1>Analysis</h1>
    <a id="scopeToggle" data-admin-only style="display:none" class="btn small secondary" href="#">Viewing: my data</a>
  </div>
  <div id="content" class="loading">Loading…</div>
</div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
Auth.requireLogin();
Auth.applyRoleNav();
Nav.render();

const params = new URLSearchParams(location.search);
const scopeAll = params.get('scope') === 'all';

const toggle = document.getElementById('scopeToggle');
toggle.textContent = scopeAll ? 'Viewing: all users — switch to mine' : 'Viewing: my data — switch to all users';
toggle.addEventListener('click', (e) => {
  e.preventDefault();
  location.href = scopeAll ? 'analysis.html' : 'analysis.html?scope=all';
});

function bar(label, pct, sub) {
  const safePct = Math.max(0, Math.min(100, pct));
  return `
    <div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${safePct}%"></div></div>
      <div class="bar-value">${pct}%</div>
    </div>${sub ? `<div style="margin:-4px 0 8px 200px;font-size:11px;color:var(--text-muted)">${sub}</div>` : ''}`;
}

function formatMinutes(mins) {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function load() {
  const el = document.getElementById('content');
  try {
    const o = await Api.getAnalysisOverview(scopeAll ? { scope: 'all' } : undefined);
    if (o.overall.totalAttempts === 0) {
      el.className = 'empty-state';
      el.textContent = 'No submitted attempts yet — take an exam first to see analysis.';
      return;
    }
    el.className = '';

    const chapterBars = o.byChapter.map(c => bar(`${c.chapter} — ${c.chapterTitle}`, c.accuracyPct, `${c.correct}/${c.questionsSeen} correct`)).join('');
    const topicRows = o.byTopic.length ? o.byTopic.map(t => `<tr><td>${t.topic}</td><td>${t.correct}/${t.questionsSeen}</td><td>${t.accuracyPct}%</td></tr>`).join('')
      : '<tr><td colspan="3" class="empty-state">No topic-tagged questions answered yet.</td></tr>';
    const trendRows = o.trend.slice().reverse().map(t => `<tr><td>#${t.attemptId}</td><td>${new Date(t.submittedAtUtc).toLocaleString()}</td><td>${t.percentScore}%</td></tr>`).join('');

    el.innerHTML = `
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">Total attempts</div><div class="metric-value">${o.overall.totalAttempts}</div></div>
        <div class="metric"><div class="metric-label">Average score</div><div class="metric-value">${o.overall.avgPercent}%</div></div>
        <div class="metric"><div class="metric-label">Pass rate</div><div class="metric-value">${o.overall.passRate}%</div></div>
        <div class="metric"><div class="metric-label">Study time</div><div class="metric-value">${formatMinutes(o.overall.studyTimeMinutes)}</div></div>
        <div class="metric"><div class="metric-label">Completed exams</div><div class="metric-value">${o.overall.completedExams}</div></div>
        <div class="metric"><div class="metric-label">Weakest chapters</div><div class="metric-value" style="font-size:14px">${o.weakestChapters.join(', ')}</div></div>
      </div>

      <div class="section-title">Accuracy by chapter</div>
      <div class="card">${chapterBars}</div>

      <div class="section-title">Accuracy by topic (application-style questions only)</div>
      <div class="card">
        <table class="data-table">
          <thead><tr><th>Topic</th><th>Correct</th><th>Accuracy</th></tr></thead>
          <tbody>${topicRows}</tbody>
        </table>
      </div>

      <div class="section-title">Trend (most recent first)</div>
      <div class="card">
        <table class="data-table">
          <thead><tr><th>Attempt</th><th>Submitted</th><th>Score</th></tr></thead>
          <tbody>${trendRows}</tbody>
        </table>
      </div>
    `;
  } catch (err) {
    el.className = 'empty-state';
    el.textContent = 'Could not reach the backend API: ' + err.message;
  }
}

load();
</script>
</body>
</html>
