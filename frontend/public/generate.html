<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate Exam — TAE Exam System</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="layout">
<div id="sidebarRoot" class="sidebar"></div>
<div class="main-content">
<div id="topBarRoot" class="top-bar"></div>
<div class="container">
  <div class="page-header"><h1>Generate a new exam</h1></div>
  <p class="meta" style="color:var(--text-secondary);font-size:13px;margin-top:-8px">
    Assembles a fresh paper from the imported question bank, matching the syllabus's chapter blueprint.
    Turning on the boost below shifts extra questions toward chapters where your recorded accuracy is below average.
  </p>

  <div class="card" style="max-width:480px">
    <div class="form-row">
      <label for="title">Title (optional)</label>
      <input type="text" id="title" placeholder="e.g. Practice paper 3">
    </div>
    <div class="form-row">
      <label for="questionCount">Number of questions</label>
      <input type="number" id="questionCount" value="40" min="5" max="240">
    </div>
    <div class="form-row">
      <label class="checkbox-row"><input type="checkbox" id="boost" checked> Boost chapters where I'm weak</label>
    </div>
    <button class="btn" id="generateBtn" onclick="generate()">Generate exam</button>
    <div id="status" style="margin-top:12px;font-size:12px;color:var(--text-secondary)"></div>
  </div>
</div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
Auth.requireLogin();
Auth.applyRoleNav();
Nav.render();

async function generate() {
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Generating…';
  try {
    const title = document.getElementById('title').value.trim();
    const questionCount = Number(document.getElementById('questionCount').value) || 40;
    const boost = document.getElementById('boost').checked;
    const result = await Api.generateExam({
      title: title || null,
      questionCount,
      boostWeakChapters: boost,
    });
    status.textContent = `Generated exam #${result.examId}. Redirecting…`;
    if (result.warnings && result.warnings.length) {
      console.warn('Generation warnings:', result.warnings);
    }
    location.href = `exam.html?examId=${result.examId}`;
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
