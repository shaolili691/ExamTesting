<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attempt Review — TAE Exam System</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="layout">
<div id="sidebarRoot" class="sidebar"></div>
<div class="main-content">
<div id="topBarRoot" class="top-bar"></div>
<div class="container">
  <div class="page-header"><h1 id="pageTitle">Attempt review</h1></div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('review')">Results</button>
    <button class="tab-btn" onclick="showTab('answers')">Answer key</button>
  </div>

  <div id="review" class="tab-panel show"><div id="reviewContent" class="loading">Loading…</div></div>
  <div id="answers" class="tab-panel"><div id="answerContent"></div></div>
</div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
Auth.requireLogin();
Auth.applyRoleNav();
Nav.render();

const params = new URLSearchParams(location.search);
const attemptId = Number(params.get('attemptId'));

function formatDuration(totalSeconds) {
  if (totalSeconds == null) return null;
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('show');
  const idx = { review: 0, answers: 1 }[name];
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

function chapterBadge(chapter) { return `<span class="badge b-ch">${chapter}</span>`; }

function optionsListHtml(q) {
  const selected = new Set(q.selectedIndexes);
  const correct = new Set(q.correctIndexes);
  return q.options.map((opt, i) => {
    const isCorrect = correct.has(i);
    const wasSelected = selected.has(i);
    const cls = ['opt', 'static'];
    if (isCorrect) cls.push('opt-correct');
    else if (wasSelected) cls.push('opt-wrong');
    let tag = '';
    if (isCorrect && wasSelected) tag = '<span class="opt-tag opt-tag-correct">Your answer · Correct</span>';
    else if (isCorrect) tag = '<span class="opt-tag opt-tag-correct">Correct answer</span>';
    else if (wasSelected) tag = '<span class="opt-tag opt-tag-wrong">Your answer</span>';
    return `
      <div class="${cls.join(' ')}">
        <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
        <span class="opt-text">${opt}</span>
        ${tag}
      </div>`;
  }).join('');
}

function renderAnswerKey(result) {
  const rows = result.questions.map(q => `
    <tr>
      <td>${chapterBadge(q.chapter)}</td>
      <td>${q.points}</td>
      <td class="key-ans">${q.correctIndexes.map(i => q.options[i]).join(', ')}</td>
      <td>${q.explanation}</td>
    </tr>`).join('');
  document.getElementById('answerContent').innerHTML = `
    <table class="key-table">
      <thead><tr><th>Ch</th><th>Pts</th><th>Correct answer</th><th>Explanation</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

let reviewQuestions = [];
let reviewIndex = 0;

function questionCardHtml(q, i) {
  const answered = q.selectedIndexes.length > 0;
  const cls = !answered ? 'skipped' : (q.isCorrect ? 'correct' : 'wrong');
  return `
    <div class="ans-card ${cls}">
      <div class="ans-qnum">Q${i + 1} · ${q.chapter} · ${q.pointsAwarded}/${q.points} pts</div>
      ${q.scenarioText ? `<div class="q-scenario">${q.scenarioText}</div>` : ''}
      <div class="q-text">${q.questionText}</div>
      <div class="q-opts">${optionsListHtml(q)}</div>
      ${!answered ? '<div class="sel-note">You left this question unanswered.</div>' : ''}
      <div class="ans-expl" style="margin-top:8px">${q.explanation}</div>
    </div>`;
}

function showQuestion(i) {
  reviewIndex = i;
  document.getElementById('reviewQuestionCard').innerHTML = questionCardHtml(reviewQuestions[i], i);
  document.querySelectorAll('.qnav-btn[data-index]').forEach((btn) => {
    btn.classList.toggle('current', Number(btn.getAttribute('data-index')) === i);
  });
}

function renderResults(result) {
  document.getElementById('pageTitle').textContent = `Attempt review — ${result.examTitle}`;
  reviewQuestions = result.questions;
  const pct = result.maxScore > 0 ? Math.round((result.score / result.maxScore) * 100) : 0;
  const chCards = result.chapterBreakdown.map(c => `
    <div class="ch-card">
      <div class="ch-card-title">${c.chapter} — ${c.chapterTitle}</div>
      <div class="ch-card-score">${c.correct}/${c.total} · ${c.pointsEarned}/${c.pointsMax} pts</div>
    </div>`).join('');
  const navButtons = result.questions.map((q, i) => {
    const answered = q.selectedIndexes.length > 0;
    const state = !answered ? 'skip' : (q.isCorrect ? 'correct' : 'wrong');
    return `<button type="button" class="qnav-btn ${state}${i === 0 ? ' current' : ''}" data-index="${i}" title="Q${i + 1} · ${q.chapter} · ${q.pointsAwarded}/${q.points} pts">${i + 1}</button>`;
  }).join('');

  document.getElementById('reviewContent').innerHTML = `
    <div class="result-header">
      <div class="result-score">${result.score} / ${result.maxScore} pts</div>
      <div class="result-pct">${pct}%${formatDuration(result.elapsedSeconds) ? ' · Time: ' + formatDuration(result.elapsedSeconds) : ''}</div>
      <div class="result-msg ${result.passed ? 'pass-msg' : 'fail-msg'}">${result.passed ? 'Pass' : 'Not yet — keep practicing'}</div>
    </div>
    <div class="ch-summary">${chCards}</div>
    <div class="section-title">Question-by-question review</div>
    <div class="exam-layout">
      <div class="exam-sidebar">${navButtons}</div>
      <div class="exam-main"><div id="reviewQuestionCard"></div></div>
    </div>
  `;

  document.querySelectorAll('.qnav-btn[data-index]').forEach((btn) => {
    btn.addEventListener('click', () => showQuestion(Number(btn.getAttribute('data-index'))));
  });
  showQuestion(0);
}

async function load() {
  try {
    const result = await Api.getAttempt(attemptId);
    renderResults(result);
    renderAnswerKey(result);
  } catch (err) {
    document.getElementById('reviewContent').innerHTML = `<p class="empty-state">${err.message}</p>`;
  }
}

load();
</script>
</body>
</html>
