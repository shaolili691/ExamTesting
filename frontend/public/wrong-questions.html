<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong Questions — TAE Exam System</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="layout">
<div id="sidebarRoot" class="sidebar"></div>
<div class="main-content">
<div id="topBarRoot" class="top-bar"></div>
<div class="container">
  <div class="page-header">
    <h1>Wrong question book</h1>
    <a class="btn" id="practiceBtn" href="drill.html?source=wrong-book">Practice all</a>
  </div>
  <p class="meta" style="color:var(--text-secondary);font-size:13px;margin-top:-8px">
    Every question you've ever gotten wrong or left unanswered, across all your submitted attempts — most recently missed first.
    A question is removed automatically once you answer it correctly 3 times.
  </p>
  <div id="content" class="loading">Loading…</div>
</div>
</div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
Auth.requireLogin();
Auth.applyRoleNav();
Nav.render();

function chapterBadge(chapter) { return `<span class="badge b-ch">${chapter}</span>`; }
function levelBadge(level) { return level ? `<span class="badge b-k${level.slice(1)}">${level}</span>` : ''; }

function difficultyStars(level) {
  const n = level ? parseInt(level.replace(/\D/g, ''), 10) : 0;
  if (!n) return null;
  const filled = Math.max(1, Math.min(5, n));
  return '★'.repeat(filled) + '☆'.repeat(5 - filled);
}

function optionsListHtml(q) {
  const selected = new Set(q.lastSelectedIndexes);
  const correct = new Set(q.correctIndexes);
  return q.options.map((opt, i) => {
    const isCorrect = correct.has(i);
    const wasSelected = selected.has(i);
    const cls = ['opt', 'static'];
    if (isCorrect) cls.push('opt-correct');
    else if (wasSelected) cls.push('opt-wrong');
    let tag = '';
    if (isCorrect && wasSelected) tag = '<span class="opt-tag opt-tag-correct">Your answer · Correct</span>';
    else if (isCorrect) tag = '<span class="opt-tag opt-tag-correct">Correct answer</span>';
    else if (wasSelected) tag = '<span class="opt-tag opt-tag-wrong">Your answer</span>';
    return `
      <div class="${cls.join(' ')}">
        <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
        <span class="opt-text">${opt}</span>
        ${tag}
      </div>`;
  }).join('');
}

async function load() {
  const el = document.getElementById('content');
  try {
    const items = await Api.getWrongQuestions();
    if (items.length === 0) {
      document.getElementById('practiceBtn').style.display = 'none';
      el.className = 'empty-state';
      el.textContent = 'No wrong answers recorded yet — nice work, or you haven\'t submitted an attempt.';
      return;
    }
    el.className = '';
    el.innerHTML = items.map(q => {
      const stars = difficultyStars(q.level);
      return `
        <div class="q-block weak-q">
          <div class="q-meta">
            ${chapterBadge(q.chapter)} ${levelBadge(q.level)}
            <span class="badge b-weak">Missed ${q.timesMissed}×</span>
            <span class="meta" style="font-size:11px;color:var(--text-muted)">Last missed ${new Date(q.lastMissedAtUtc).toLocaleDateString()}</span>
          </div>
          ${q.scenarioText ? `<div class="q-scenario">${q.scenarioText}</div>` : ''}
          <div class="q-text">${q.questionText}</div>
          <div class="q-opts">${optionsListHtml(q)}</div>
          ${q.lastSelectedIndexes.length === 0 ? '<div class="sel-note">You left this question unanswered.</div>' : ''}
          <div class="ans-card correct" style="margin-top:10px">
            <div class="ans-expl">
              <span class="badge b-neutral">Score: ${q.points} pt${q.points === 1 ? '' : 's'}</span>
              ${stars ? `<span class="badge b-neutral" style="margin-left:6px">Difficulty: ${stars}</span>` : ''}
            </div>
            <div class="ans-expl" style="margin-top:6px">Explanation: ${q.explanation}</div>
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    el.className = 'empty-state';
    el.textContent = 'Could not reach the backend API: ' + err.message;
  }
}

load();
</script>
</body>
</html>
